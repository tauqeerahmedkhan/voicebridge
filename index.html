<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live Chinese ⇄ Urdu Voice Translator</title>
    <!-- Tailwind CSS for clean, responsive UI -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col justify-between">

    <!-- Header -->
    <header class="p-4 bg-slate-800 border-b border-slate-700 text-center">
        <h1 class="text-xl font-bold tracking-wide">🇨🇳 Live Chinese ⇄ Urdu 🇵🇰</h1>
        <p class="text-xs text-slate-400 mt-1">Cross-platform Web Translator (No Install Required)</p>
    </header>

    <!-- Main Translation Workspace -->
    <main class="flex-1 max-w-3xl w-full mx-auto p-4 flex flex-col gap-4 justify-center">
        
        <!-- Chinese Panel -->
        <div class="bg-slate-800 border border-slate-700 rounded-xl p-4 shadow-lg flex flex-col justify-between">
            <div class="flex justify-between items-center mb-2">
                <span class="text-sm font-semibold text-sky-400">Chinese (中文)</span>
                <span id="zh-status" class="text-xs px-2 py-0.5 rounded bg-slate-700 text-slate-300">Ready</span>
            </div>
            <div id="zh-text" class="text-lg min-h-[80px] p-3 bg-slate-900 rounded-lg text-slate-200">
                Tap the microphone and speak in Chinese...
            </div>
        </div>

        <!-- Urdu Panel (RTL Support) -->
        <div class="bg-slate-800 border border-slate-700 rounded-xl p-4 shadow-lg flex flex-col justify-between">
            <div class="flex justify-between items-center mb-2">
                <span class="text-sm font-semibold text-emerald-400">Urdu (اردو)</span>
                <span id="ur-status" class="text-xs px-2 py-0.5 rounded bg-slate-700 text-slate-300">Ready</span>
            </div>
            <!-- dir="rtl" ensures correct Urdu layout alignment -->
            <div id="ur-text" dir="rtl" class="text-lg min-h-[80px] p-3 bg-slate-900 rounded-lg text-slate-200 font-serif">
                مائیکروفون دبا کر اردو میں بات کریں...
            </div>
        </div>

    </main>

    <!-- Control Bar -->
    <footer class="p-6 bg-slate-800 border-t border-slate-700 flex flex-col items-center gap-3">
        <div id="instruction" class="text-xs text-slate-400">Tap to start speaking (Auto-detects language)</div>
        <button id="micButton" onclick="toggleListening()" class="w-16 h-16 rounded-full bg-sky-600 hover:bg-sky-500 flex items-center justify-center shadow-xl transition transform active:scale-95 focus:outline-none">
            <svg id="micIcon" class="w-8 h-8 text-white" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" d="M19 11a7 7 0 01-7 7m0 0a7 7 0 01-7-7m7 7v4m0 0H8m4 0h4m-4-8a3 3 0 01-3-3V5a3 3 0 116 0v6a3 3 0 01-3 3z"></path>
            </svg>
        </button>
    </footer>

    <script>
        let isListening = false;

        function toggleListening() {
            isListening = !isListening;
            const btn = document.getElementById('micButton');
            const instruction = document.getElementById('instruction');
            
            if (isListening) {
                btn.classList.remove('bg-sky-600', 'hover:bg-sky-500');
                btn.classList.add('bg-rose-600', 'hover:bg-rose-500', 'animate-pulse');
                instruction.textContent = "Listening... Speak now.";
                
                // --- Placeholder simulation for live translation backend connection ---
                setTimeout(() => {
                    document.getElementById('zh-text').textContent = "你好，请问去机场怎么走？";
                    document.getElementById('ur-text').textContent = "ہیلو، کیا آپ بتا سکتے ہیں کہ ہوائی اڈے کا راستہ کیا ہے؟";
                }, 2000);
            } else {
                btn.classList.remove('bg-rose-600', 'hover:bg-rose-500', 'animate-pulse');
                btn.classList.add('bg-sky-600', 'hover:bg-sky-500');
                instruction.textContent = "Tap to start speaking (Auto-detects language)";
            }
        }
    </script>
</body>
</html>
