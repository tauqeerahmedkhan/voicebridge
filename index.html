<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>VoiceBridge</title>
    <style>
      :root {
        --bg: #0b1120;
        --panel: #111827;
        --accent: #60a5fa;
        --text: #e5e7eb;
        --muted: #94a3b8;
      }

      * { box-sizing: border-box; }

      body {
        margin: 0;
        font-family: Arial, Helvetica, sans-serif;
        background: linear-gradient(135deg, var(--bg), #172554);
        color: var(--text);
      }

      .container {
        max-width: 960px;
        margin: 0 auto;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 32px 20px;
      }

      .card {
        width: 100%;
        background: rgba(17, 24, 39, 0.9);
        border: 1px solid rgba(148, 163, 184, 0.2);
        border-radius: 20px;
        padding: 48px 32px;
        box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
      }

      .eyebrow {
        display: inline-block;
        color: var(--accent);
        font-size: 12px;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        margin-bottom: 18px;
      }

      h1 {
        margin: 0 0 16px;
        font-size: clamp(2.2rem, 5vw, 4rem);
        line-height: 1.1;
      }

      p {
        margin: 0;
        color: var(--muted);
        font-size: 1.08rem;
        line-height: 1.7;
      }

      .actions {
        margin-top: 28px;
        display: flex;
        flex-wrap: wrap;
        gap: 16px;
      }

      .button {
        display: inline-block;
        padding: 12px 20px;
        border-radius: 999px;
        font-weight: 700;
        text-decoration: none;
        transition: transform 0.2s ease, opacity 0.2s ease;
      }

      .button:hover {
        transform: translateY(-1px);
      }

      .primary {
        background: var(--accent);
        color: #08111f;
      }

      .secondary {
        border: 1px solid rgba(96, 165, 250, 0.4);
        color: var(--text);
      }
    </style>
  </head>
  <body>
    <main class="container">
      <section class="card">
        <div class="eyebrow">VoiceBridge</div>
        <h1>Connect ideas through voice.</h1>
        <p>
          This repository now includes a starter landing page for VoiceBridge. You can replace
          this content with your product branding, app description, or launch page copy.
        </p>
        <div class="actions">
          <a class="button primary" href="#">Get Started</a>
          <a class="button secondary" href="#">Learn More</a>
        </div>
      </section>
    </main>
  </body>
</html>
